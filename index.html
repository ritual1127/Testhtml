* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #10141b;
    color: #e9eef5;
}

header {
    padding: 20px 25px;
    background: #171d27;
    border-bottom: 1px solid #2b3442;

.container {

    margin: auto;
    padding: 20px;
}

.controls {
    display: flex;

    gap: 10px;
    margin-bottom: 18px;
}

button {
    border: 1px solid #3a4555;

    color: white;
    padding: 11px 18px;

button:hover {
    background: #2b3645;

button.active {

    border-color: #3292ef;
}

    padding: 8px 14px;

input[type="range"] {
    width: 130px;
}

.simulator {

    border-radius: 12px;
    overflow: hidden;
}

svg {

    height: auto;
    min-height: 560px;
    display: block;
}

.status-area {

}

    border: 1px solid #2b3442;

    padding: 14px;

.status-title {

    font-size: 12px;
    margin-bottom: 7px;
}

.status-value {
    font-size: 17px;
    font-weight: bold;
}

.good {
    color: #42d392;
}

.warn {

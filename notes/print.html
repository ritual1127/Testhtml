<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유압제어 실습과제 핵심 요약</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @page { size: A4; margin: 9mm 10mm 9mm; }
  html, body { background: #fff !important; }
  body {
    font-family: "Noto Sans KR", "NanumGothic", sans-serif !important;
    font-size: 9.7pt; line-height: 1.42; color: #000 !important; margin: 0;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  b { font-weight: 800; }
  .page { break-after: page; width: 190mm; height: 278mm; overflow: hidden; display: flex; flex-direction: column; gap: 2mm; }
  .page:last-child { break-after: auto; }
  header { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid #000; padding-bottom: 1.2mm; }
  header h1 { font-size: 15pt; margin: 0; color: #000; font-weight: 800; }
  header .sub { font-size: 10pt; font-weight: 600; }
  header .src { margin-left: auto; font-size: 8.5pt; color: #444; }
  .top { display: grid; grid-template-columns: 72mm 1fr; gap: 2mm; align-items: stretch; }
  .fig { border: 1px solid #000; padding: 1mm; display: flex; align-items: center; justify-content: center; }
  .fig svg { width: 100%; height: auto; max-height: 84mm; display: block; }
  .box { border: 1px solid #000; padding: 1.2mm 2.5mm 1.5mm; }
  .bt { font-weight: 800; font-size: 10pt; border-bottom: 1px solid #000; margin: 0 -2.5mm 1mm; padding: 0 2.5mm 0.6mm; background: #e6e6e6; }
  .box ul { margin: 0; padding-left: 4.2mm; }
  .box li { margin: 0.6mm 0; }
  ul.parts { list-style: none; padding-left: 0 !important; columns: 2; column-gap: 6mm; }
  ul.parts li { margin: 0.2mm 0; break-inside: avoid; }
  table.tb { width: 100%; border-collapse: collapse; font-size: 9.2pt; }
  table.tb th, table.tb td { border: 1px solid #555; padding: 0.3mm 1.5mm; }
  table.tb th { background: #f0f0f0; font-weight: 800; }
  table.tb td:nth-child(-n+5) { text-align: center; white-space: nowrap; }
  .mark { margin: 0; font-size: 8.5pt; }
  .defs { display: grid; grid-template-columns: 1fr 1fr; gap: 2mm 3mm; }
  .defs .d { border: 1px solid #000; padding: 1.2mm 2.2mm 1.5mm; break-inside: avoid; }
  .defs .dt { font-weight: 800; font-size: 10.5pt; border-bottom: 1px solid #000; margin-bottom: 0.8mm; }
  .page.p4 { font-size: 10.6pt; line-height: 1.45; gap: 2.5mm; }

  /* 회로도 흑백 */
  .dia .hl-base, .dia .hl-base[class*="s-"] { stroke: #000 !important; stroke-width: 2.2px !important; }
  .dia .hl-base.pilotline { stroke-dasharray: 7 5; stroke-width: 1.7px !important; }
  .dia .hl-flow, .dia .lw-flow, .dia .hit, .dia .val-bg, .dia .svg-val, .dia .lad-ab { display: none !important; }
  .dia .chamber { fill: transparent !important; }
  .dia .ball { fill: #fff !important; stroke: #000 !important; transform: none !important; }
  .dia .solenoid { fill: #fff !important; stroke: #000 !important; }
  .dia .sol-diag { stroke: #000 !important; }
  .dia .ls-box, .dia .ls-roller { fill: #fff !important; stroke: #000 !important; }
  .dia .ls-plunger { transform: none !important; }
  .dia .relief-arrow { transform: none !important; }
  .dia .relief-arrow .ra-line { stroke: #000 !important; stroke-width: 2px !important; }
  .dia .relief-arrow .ra-head { fill: #000 !important; }
  .dia .v-item { stroke: #000 !important; stroke-width: 1.8px !important; }
  .dia .v-head { fill: #000 !important; }
  .dia .v-sq, .dia .v-sq.active { fill: #fff !important; stroke: #000 !important; }
  .dia .sym, .dia .sym-thin, .dia .spring, .dia .sym-fill, .dia .gauge-face, .dia .rod { stroke: #000 !important; }
  .dia .sym-fill, .dia .gauge-face, .dia .rod { fill: #fff !important; }
  .dia .sym-solid, .dia .piston, .dia .jdot { fill: #000 !important; }
  .dia .sym-dash, .dia .sym-dash.on { stroke: #000 !important; stroke-width: 1.5px !important; }
  .dia .gauge-needle { stroke: #000 !important; transform: rotate(40deg) !important; }
  .dia .dog { fill: #999 !important; }
  .dia .spin { animation: none !important; }
  .dia .box-dash { stroke: #000 !important; }
  .dia .svg-label { fill: #000 !important; }
  .dia .plain-name { fill: #000 !important; font-weight: 700; font-size: 13px; }
  .dia .tag-bg { fill: #fff !important; stroke: #000 !important; opacity: 1 !important; }
  .dia .tag-num, .dia .tag-name { fill: #000 !important; }
  .dia .tag-name { font-size: 14px; }
  .dia .lw, .dia .lw.live, .dia .lw.cur, .dia .rail, .dia .rail0 { stroke: #000 !important; stroke-width: 2.2px !important; }
  .dia .blade, .dia .blade.cur, .dia .term, .dia .term.cur { stroke: #000 !important; stroke-width: 2.4px !important; }
  .dia .act, .dia .act-dash { stroke: #000 !important; }
  .dia .coil, .dia .coil.on { fill: #fff !important; stroke: #000 !important; stroke-dasharray: none !important; }
  .dia .coil-diag { stroke: #000 !important; }
  .dia .lad-label { fill: #000 !important; font-size: 16px; }
  .dia .lad-rail-label { fill: #000 !important; font-size: 14px; }
  .dia .rung-no { fill: #666 !important; font-size: 12px; }
  @media screen {
    body { background: #ddd !important; }
    .page { width: 190mm; margin: 8px auto; background: #fff; padding: 9mm 10mm; box-sizing: content-box; box-shadow: 0 1px 8px rgba(0,0,0,.2); }
  }
</style>
</head>
<body>
<div id="doc"></div>
<script src="../js/svg.js"></script>
<script src="../js/hyd.js"></script>
<script src="../js/ladder.js"></script>
<script src="../js/sim.js"></script>
<script src="../js/tasks.js"></script>
<script src="notes.js"></script>
</body>
</html>
